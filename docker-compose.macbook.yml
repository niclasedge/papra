# Papra on the MacBook, at http://127.0.0.1:1221 and https://docs.lan.niclasedge.com
# (the Mini's Traefik dials it over the tailnet: IaC-Stack
# ansible/playbooks/runbooks/vars/traefik_remote_services.yml, entry `docs`).
# Deployed by IaC-Stack (services.yml: papra, rsync-build, this file).
# Answers only while the MacBook is awake.
#
# Data layout:
#   papra-db (named volume)   SQLite DB + config at /app/app-data. Deliberately NOT a
#                             bind mount and NOT in Dropbox: POSIX locks are not shared
#                             over OrbStack's virtiofs, and a sync client must never see
#                             a live DB with its -wal/-shm sidecars.
#   ~/Dropbox/Docs-Private-Papra, mounted at /dropbox
#     documents/              document files, unencrypted, readable names (key pattern)
#     ingestion/<org_id>/     watched folder: mail fetcher, Finder, phone
#     db-backup/              consistent DB snapshot, one file per day, refreshed hourly
#
# Secrets: AUTH_SECRET (papra) and GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET,
# GMAIL_REFRESH_TOKEN, PAPRA_ORG_ID (papra-mail-fetch) come from .env, rendered
# by IaC-Stack (env_from_secrets).
services:
  papra:
    build:
      context: .
      dockerfile: packages/app/Dockerfile
    image: papra:local
    container_name: papra
    restart: unless-stopped
    ports:
      - "127.0.0.1:1221:1221"
    environment:
      TZ: Europe/Berlin
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET missing, rendered by IaC-Stack env_from_secrets}
      APP_BASE_URL: https://docs.lan.niclasedge.com
      TRUSTED_ORIGINS: http://127.0.0.1:1221,http://localhost:1221
      # Closed after the first (admin) account was created on 2026-10-22.
      AUTH_IS_REGISTRATION_ENABLED: "false"
      DOCUMENTS_OCR_LANGUAGES: deu,eng
      DOCUMENT_STORAGE_FILESYSTEM_ROOT: /dropbox/documents
      DOCUMENT_STORAGE_USE_LEGACY_STORAGE_KEY_DEFINITION_SYSTEM: "false"
      DOCUMENT_STORAGE_KEY_PATTERN: "{{organization.name}}/{{currentDate.yyyy}}/{{document.name}}"
      DOCUMENT_STORAGE_KEY_SYNC_ENABLED: "true"
      INGESTION_FOLDER_IS_ENABLED: "true"
      INGESTION_FOLDER_ROOT_PATH: /dropbox/ingestion
      # File events from macOS do not reliably reach the Linux VM.
      INGESTION_FOLDER_WATCHER_USE_POLLING: "true"
      INGESTION_FOLDER_POST_PROCESSING_STRATEGY: move
    volumes:
      - papra-db:/app/app-data
      - /Users/niclasedge/Dropbox/Docs-Private-Papra:/dropbox

  # Hourly `.backup` into Dropbox. Runs in the same Linux VM as papra, so SQLite's
  # locks and WAL index are shared, unlike a sqlite3 started on the macOS host.
  papra-db-backup:
    image: alpine:3.22
    container_name: papra-db-backup
    restart: unless-stopped
    command: ["sh", "/deploy/papra-db-backup.sh"]
    environment:
      TZ: Europe/Berlin
    volumes:
      - papra-db:/data   # rw: reading a WAL database still writes its -shm index
      - ./deploy:/deploy:ro
      - /Users/niclasedge/Dropbox/Docs-Private-Papra/db-backup:/backup

  # Gmail label `Papra` -> /ingestion/<org_id>/, then label `Papra/Done`
  # (Gmail REST API, OAuth client of ~/GITHUB/gmail). Idles until GMAIL_CLIENT_ID,
  # GMAIL_CLIENT_SECRET, GMAIL_REFRESH_TOKEN and PAPRA_ORG_ID are in .env.
  papra-mail-fetch:
    image: python:3.13-alpine
    container_name: papra-mail-fetch
    restart: unless-stopped
    command: ["python", "-u", "/deploy/papra-mail-fetch.py"]
    env_file: .env
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./deploy:/deploy:ro
      - /Users/niclasedge/Dropbox/Docs-Private-Papra/ingestion:/ingestion

volumes:
  papra-db:
